<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Seekworthy launch graphics</title>
<style>
/* Type: the reference uses Söhne (commercial). Inter Tight is the closest
   open-licence match; point --sans at a licensed Söhne to swap. */
@font-face { font-family: "Inter Tight"; src: url("../../assets/fonts/InterTight-var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist"; src: url("../../assets/fonts/Geist-variable-latin.woff2") format("woff2"); font-weight: 100 900; }

/* Seekworthy colours only: the reference's flat brand red becomes
   Seekworthy blue; its red/cyan/white gradient becomes blue/cyan/white;
   lime is the key-word accent on footage. */
:root {
  --sans: "Inter Tight", "Inter", sans-serif;
  --blue: #3f5efb;
  --blue-deep: #2743c9;
  --blue-soft: #c9d4ff;
  --cyan: #5fd0ff;
  --lime: #b8ff3c;
  --ink: #0f1b4c;
  --body: #2b3560;
  --muted: #6b7394;
  --faint: #a3aac4;
  --line: #e4e7f0;
  --surface: #f5f7fb;
  --danger: #d6334a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
body { font-family: var(--sans); color: #fff; -webkit-font-smoothing: antialiased; }
.layer { position: absolute; inset: 0; overflow: hidden; }
body[data-layer="back"] #front { display: none; }
body[data-layer="front"] #back, body[data-layer="glass"] #back { display: none; }
/* glass layer: only the frosted panels, as solid white masks */
body[data-layer="glass"] #front * { visibility: hidden; }
body[data-layer="glass"] #front .glass { visibility: visible; background: #fff !important; border-color: #fff !important; box-shadow: none !important; }
.abs { position: absolute; }
.w { display: inline-block; white-space: pre; }

/* frosted panels over footage (the compositor blurs what is behind .glass) */
.gd { background: rgba(28, 30, 44, 0.34); border: 1.5px solid rgba(255,255,255,0.22); border-radius: 22px; box-shadow: 0 24px 60px -24px rgba(0,0,0,.45); }
.gl { background: rgba(255,255,255,0.42); border: 1.5px solid rgba(255,255,255,0.75); border-radius: 26px; box-shadow: 0 30px 80px -30px rgba(15,27,76,.35); }
.card { background: #fff; border-radius: 22px; color: var(--ink); box-shadow: 0 1px 2px rgba(15,27,76,.06), 0 18px 40px -18px rgba(15,27,76,.28); }
.pill { display: inline-flex; align-items: center; gap: 14px; }
.tag { font-size: 22px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 4px 12px; border-radius: 8px; }
.fav { display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; border-radius: 12px; flex: none; }
.btn { display: inline-flex; align-items: center; gap: 10px; background: var(--blue); color: #fff; font-weight: 500; border-radius: 12px; }
.ribs { background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 2px, rgba(255,255,255,0) 2px 56px); }
</style>
</head>
<body data-layer="front">
<div id="back" class="layer"></div>
<div id="front" class="layer"></div>
<script src="data.js"></script>
<script src="timeline.js"></script>
</body>
</html>
